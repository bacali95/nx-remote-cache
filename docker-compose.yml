services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: nxcache
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-nxcache-dev-password}
      POSTGRES_DB: nxcache
    ports:
      - "5433:5432" # host 5433 avoids clashing with a local postgres; containers still talk on 5432
    volumes:
      - pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nxcache"]
      interval: 5s
      timeout: 5s
      retries: 10

  nx-remote-cache:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "3000:3000"
    environment:
      PORT: "3000"
      # Container-to-container traffic uses postgres's internal port (5432)
      # regardless of the host-side mapping above.
      DATABASE_URL: postgres://nxcache:${POSTGRES_PASSWORD:-nxcache-dev-password}@postgres:5432/nxcache?sslmode=disable
      # Encrypts cloud credentials (if configured via the Settings page) at
      # rest in Postgres. Generate with: openssl rand -base64 32
      SETTINGS_ENCRYPTION_KEY: ${SETTINGS_ENCRYPTION_KEY:?set SETTINGS_ENCRYPTION_KEY in .env — see README}
      # First-run only: creates one admin user if the users table is empty.
      # Log in and create real accounts/tokens from the UI, then you can
      # drop these two. Storage backend, session TTL, and max cache entry
      # size are configured from the admin UI's Settings page, not env
      # vars — they default sensibly (local disk, 24h, 500MB) on first run.
      ADMIN_BOOTSTRAP_EMAIL: ${ADMIN_BOOTSTRAP_EMAIL:-admin@example.com}
      ADMIN_BOOTSTRAP_PASSWORD: ${ADMIN_BOOTSTRAP_PASSWORD:-change-me-immediately}
      # Plain http:// locally; set true (the default in production) once
      # this sits behind TLS.
      COOKIE_SECURE: "false"
    volumes:
      - cache-data:/data
    healthcheck:
      # The runtime image is distroless — no curl/wget/shell available, so
      # the healthcheck runs the server binary's own "healthcheck" mode.
      test: ["CMD", "/server", "healthcheck"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  cache-data:
  pg-data:
