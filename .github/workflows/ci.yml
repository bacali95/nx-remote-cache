name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: nxcache
          POSTGRES_PASSWORD: nxcache-ci-password
          POSTGRES_DB: nxcache
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nxcache"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      TEST_DATABASE_URL: postgres://nxcache:nxcache-ci-password@localhost:5432/nxcache?sslmode=disable

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Build admin UI
        working-directory: web
        run: |
          bun install --frozen-lockfile
          bun run build

      - name: Vet
        run: go vet ./...

      - name: Build
        run: go build ./...

      - name: Test
        # -p 1: several packages share the Postgres service above and
        # TRUNCATE their tables at the start of each test; running package
        # binaries in parallel races them against each other.
        run: go test ./... -race -cover -p 1

      - name: Lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12.2

  docker-build-check:
    runs-on: ubuntu-latest
    # Validates the image still builds on every PR; publishing happens
    # separately in docker-publish.yml only for trusted refs (main/tags).
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
